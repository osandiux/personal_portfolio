name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Catches what the build cannot: absolute asset paths that resolve into
      # public/ are copied verbatim by Vite and never validated, and vercel.json
      # rewrites everything to index.html -- so a missing asset ships as a green
      # build and a 200 + HTML response instead of a 404.
      - name: Asset reference check
        run: npm run check:assets
